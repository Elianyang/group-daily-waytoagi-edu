<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} · {{DATE}}</title>
<style>
@font-face {
  font-family: 'SerifCJK';
  src: local('Songti SC'), local('STSong'), local('SimSun'),
       local('Noto Serif CJK SC'), local('Source Han Serif SC');
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #FFF8E9; }
body {
    font-family: 'SerifCJK', 'Songti SC', 'STSong', Georgia, serif;
    background: #FFF8E9;
    color: #2A130C;
    line-height: 1.95;
    padding: 0;
    -webkit-font-smoothing: antialiased;
}
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(184,68,60,0.025) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(212,160,23,0.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
}
.container {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 36px 80px;
    position: relative;
    z-index: 1;
}

/* ====== Masthead 报头 ====== */
.masthead {
    border-top: 4px solid #2A130C;
    border-bottom: 1px solid #2A130C;
    padding: 22px 0 18px;
    margin-bottom: 56px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
}
.masthead-name {
    font-family: 'SerifCJK', Georgia, serif;
    font-size: 38px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.5px;
}
.masthead-sub {
    font-size: 11px;
    color: #7E6799;
    letter-spacing: 5px;
    margin-top: 6px;
    text-transform: uppercase;
}
.masthead-right { font-family: Georgia, serif; font-size: 12px; text-align: right; }
.masthead-right .issue { font-size: 14px; letter-spacing: 2px; font-style: italic; }
.masthead-right .date { font-size: 11px; color: #7E6799; margin-top: 2px; letter-spacing: 1px; }

/* ====== Lead 主标题 ====== */
.lead { margin-bottom: 80px; }
.lead-eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
    color: #6E2EB8;
    margin-bottom: 14px;
    font-family: Georgia, serif;
    text-transform: uppercase;
    font-style: italic;
}
.lead-title {
    font-family: 'SerifCJK', serif;
    font-size: 48px;
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 24px;
    letter-spacing: -1px;
}
.lead-deck {
    font-family: 'SerifCJK', serif;
    font-size: 16px;
    line-height: 1.95;
    color: #3B245A;
    border-top: 1px solid #D9C7F2;
    border-bottom: 1px solid #D9C7F2;
    padding: 22px 0;
    margin-top: 28px;
}
.drop-cap {
    float: left;
    font-family: 'SerifCJK', serif;
    font-size: 64px;
    line-height: 0.85;
    font-weight: 900;
    color: #6E2EB8;
    padding-right: 10px;
    padding-top: 4px;
}

/* ====== Section 分隔 ====== */
.section-divider {
    text-align: center;
    margin: 64px 0 40px;
    font-family: Georgia, serif;
    font-size: 11px;
    letter-spacing: 6px;
    color: #7E6799;
    text-transform: uppercase;
}
.section-divider::before, .section-divider::after {
    content: '';
    display: inline-block;
    width: 60px;
    height: 1px;
    background: #D9C7F2;
    vertical-align: middle;
    margin: 0 16px;
}

/* ====== 时间故事线 ====== */
.story {
    margin-bottom: 64px;
    padding-bottom: 56px;
    border-bottom: 1px solid #D9C7F2;
}
.story:last-of-type { border-bottom: none; }
.story-header { display: flex; align-items: flex-start; gap: 24px; margin-bottom: 20px; }
.story-no {
    font-family: Georgia, serif;
    font-size: 96px;
    font-weight: 900;
    line-height: 0.85;
    color: #6E2EB8;
    flex-shrink: 0;
    letter-spacing: -3px;
}
.story-meta { flex: 1; padding-top: 14px; }
.story-time { font-family: Georgia, serif; font-size: 13px; color: #7E6799; letter-spacing: 2px; margin-bottom: 4px; }
.story-badge { font-family: 'SerifCJK', serif; font-size: 13px; color: #6E2EB8; font-style: italic; }
.story-theme {
    font-family: 'SerifCJK', serif;
    font-size: 30px;
    font-weight: 900;
    line-height: 1.3;
    margin: 8px 0 24px;
    letter-spacing: -0.5px;
}
.story-cast {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
    padding: 14px 0;
    border-top: 1px dashed #D9C7F2;
    border-bottom: 1px dashed #D9C7F2;
}
.cast-avatars { display: flex; }
.cast-avatars .avatar { margin-left: -8px; border: 2px solid #FFF8E9; }
.cast-avatars .avatar:first-child { margin-left: 0; }
.cast-label { font-family: Georgia, serif; font-size: 11px; color: #7E6799; letter-spacing: 2px; text-transform: uppercase; margin-right: 8px; }
.cast-names { font-family: 'SerifCJK', serif; font-size: 14px; }

.avatar {
    display: inline-block;
    border-radius: 50%;
    object-fit: cover;
    vertical-align: middle;
    width: 44px;
    height: 44px;
    background: #D9C7F2;
}
.avatar-text {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #2A130C;
    color: #FFF8E9;
    font-family: 'SerifCJK', serif;
    font-size: 18px;
    font-weight: 700;
}

.story-text {
    font-family: 'SerifCJK', serif;
    font-size: 16px;
    line-height: 2;
    margin-bottom: 28px;
    text-align: justify;
}
.story-quotes { margin: 28px 0; padding: 0 20px; border-left: 3px solid #6E2EB8; }
.story-quote { margin-bottom: 18px; font-family: 'SerifCJK', serif; }
.story-quote:last-child { margin-bottom: 0; }
.quote-text {
    font-size: 18px;
    line-height: 1.8;
    font-style: italic;
    margin-bottom: 6px;
    quotes: "「" "」";
}
.quote-text::before { content: open-quote; color: #6E2EB8; }
.quote-text::after { content: close-quote; color: #6E2EB8; }
.quote-attr { font-family: Georgia, serif; font-size: 12px; color: #7E6799; letter-spacing: 1px; }
.voice-badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 7px;
    background: rgba(184, 68, 60, 0.12);
    color: #6E2EB8;
    border-radius: 8px;
    font-family: 'SerifCJK', Georgia, serif;
    font-size: 10.5px;
    letter-spacing: 0;
    font-style: normal;
    vertical-align: 1px;
}
.story-output {
    font-family: Georgia, serif;
    font-size: 12px;
    color: #7E6799;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding-top: 18px;
    border-top: 1px dashed #D9C7F2;
}
.story-output b {
    font-family: 'SerifCJK', serif;
    font-size: 14px;
    color: #2A130C;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 500;
    margin-left: 6px;
}

/* ====== 高光人物 ====== */
.highlights { display: grid; grid-template-columns: 1fr 1fr; gap: 40px 28px; margin-bottom: 32px; }
.hl { display: flex; gap: 18px; align-items: flex-start; }
.hl-avatar {
    width: 72px !important;
    height: 72px !important;
    flex-shrink: 0;
    border: 1px solid #2A130C;
    box-shadow: 4px 4px 0 #6E2EB8;
    border-radius: 50%;
}
.hl-info { flex: 1; padding-top: 4px; }
.hl-name { font-family: 'SerifCJK', serif; font-size: 20px; font-weight: 900; margin-bottom: 2px; letter-spacing: -0.3px; }
.hl-tag { font-family: Georgia, serif; font-size: 11px; color: #6E2EB8; letter-spacing: 2px; text-transform: uppercase; font-style: italic; margin-bottom: 8px; }
.hl-desc { font-family: 'SerifCJK', serif; font-size: 13.5px; color: #3B245A; line-height: 1.75; }

/* ====== 折叠区 ====== */
details { margin-bottom: 14px; border-top: 1px solid #D9C7F2; padding-top: 16px; }
details summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'SerifCJK', serif;
    font-size: 18px;
    font-weight: 700;
    padding: 8px 0;
}
details summary::-webkit-details-marker { display: none; }
details summary::after { content: '展开'; font-family: Georgia, serif; font-size: 11px; color: #6E2EB8; letter-spacing: 2px; font-style: italic; }
details[open] summary::after { content: '收起'; }
details .body { padding: 14px 0 8px; }

.sop-block { margin-bottom: 32px; }
.sop-title { font-family: 'SerifCJK', serif; font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.sop-meta { font-family: Georgia, serif; font-size: 11px; color: #7E6799; letter-spacing: 1px; margin-bottom: 14px; }
.sop-steps { list-style: none; counter-reset: step; padding: 0; }
.sop-step {
    counter-increment: step;
    position: relative;
    padding: 8px 0 8px 36px;
    font-family: 'SerifCJK', serif;
    font-size: 14px;
    line-height: 1.85;
    border-bottom: 1px dashed #E6D8FA;
}
.sop-step:last-child { border-bottom: none; }
.sop-step::before {
    content: counter(step, decimal-leading-zero);
    position: absolute;
    left: 0; top: 8px;
    font-family: Georgia, serif;
    font-size: 13px;
    color: #6E2EB8;
    letter-spacing: 1px;
    font-style: italic;
}
.sop-out {
    margin-top: 14px;
    padding: 12px 16px;
    background: rgba(212,160,23,0.12);
    border-left: 2px solid #FFD84D;
    font-family: 'SerifCJK', serif;
    font-size: 13px;
    color: #6B4B00;
    line-height: 1.7;
}

.qa-item { padding: 14px 0; border-bottom: 1px dashed #E6D8FA; }
.qa-item:last-child { border: none; }
.qa-q { font-family: 'SerifCJK', serif; font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.qa-q .asker { font-family: Georgia, serif; font-size: 11px; color: #7E6799; font-weight: normal; font-style: italic; margin-left: 6px; }
.qa-a {
    padding: 6px 0 6px 14px;
    font-family: 'SerifCJK', serif;
    font-size: 13.5px;
    color: #3B245A;
    border-left: 2px solid #E6D8FA;
    margin: 4px 0;
    line-height: 1.7;
}
.qa-a b { color: #6E2EB8; font-weight: 600; margin-right: 4px; }

/* ====== Colophon 底部 ====== */
.colophon { margin-top: 80px; padding-top: 36px; border-top: 4px solid #2A130C; text-align: center; }
.colophon-stats { display: flex; justify-content: center; gap: 36px; margin-bottom: 24px; flex-wrap: wrap; }
.colophon-num { text-align: center; }
.colophon-num .n { font-family: Georgia, serif; font-size: 34px; font-weight: 900; line-height: 1; }
.colophon-num .l { font-family: Georgia, serif; font-size: 10px; color: #7E6799; letter-spacing: 3px; text-transform: uppercase; margin-top: 6px; }
.colophon-quote { font-family: 'SerifCJK', serif; font-style: italic; font-size: 14px; color: #3B245A; margin-top: 24px; padding: 0 40px; }
.colophon-quote .attr { display: block; margin-top: 8px; font-family: Georgia, serif; font-style: normal; font-size: 11px; color: #7E6799; letter-spacing: 2px; }
.colophon-meta { font-family: Georgia, serif; font-size: 10px; color: #7E6799; letter-spacing: 3px; margin-top: 32px; text-transform: uppercase; }

@media (max-width: 600px) {
    .container { padding: 32px 22px 60px; }
    .lead-title { font-size: 34px; }
    .story-no { font-size: 64px; }
    .story-theme { font-size: 22px; }
    .highlights { grid-template-columns: 1fr; }
    .masthead-name { font-size: 28px; }
}


/* ====== WaytoAGI-EDU Brand Layer ====== */
:root {
  --w-purple: #6E2EB8;
  --w-deep: #2B104C;
  --w-night: #16072B;
  --w-gold: #FFD84D;
  --w-cream: #FFF8E9;
  --w-brown: #2A130C;
  --w-blue: #39B7FF;
  --w-pink: #FF8FA3;
  --w-lavender: #F0E3FF;
}
html { background: radial-gradient(circle at 15% 3%, rgba(110,46,184,.16), transparent 30%), linear-gradient(180deg, #FFF8E9 0%, #F8EEFF 58%, #FFF8E9 100%); }
body {
  background: transparent;
  color: var(--w-brown);
}
body::before {
  background-image:
    radial-gradient(circle at 15% 14%, rgba(255,216,77,.22) 0%, transparent 22%),
    radial-gradient(circle at 86% 18%, rgba(110,46,184,.13) 0%, transparent 26%),
    radial-gradient(circle at 50% 88%, rgba(57,183,255,.10) 0%, transparent 32%),
    linear-gradient(135deg, rgba(255,255,255,.45) 0 25%, transparent 25% 50%, rgba(255,255,255,.25) 50% 75%, transparent 75% 100%);
  background-size: auto, auto, auto, 34px 34px;
}
.container::before {
  content: '';
  position: absolute;
  right: -38px;
  top: 96px;
  width: 260px;
  height: 260px;
  background: radial-gradient(circle, rgba(255,216,77,.34), rgba(110,46,184,.04) 58%, transparent 70%);
  filter: blur(.2px);
  z-index: -1;
  border-radius: 50%;
}
.masthead {
  border-top: 5px solid var(--w-deep);
  border-bottom: 1px solid rgba(110,46,184,.42);
  align-items: center;
  position: relative;
}
.brand-title-row { display:flex; align-items:center; gap:14px; }
.brand-mark {
  width: 58px; height: 58px; border-radius: 18px;
  object-fit: contain;
  background: rgba(255,255,255,.58);
  box-shadow: 0 10px 26px rgba(43,16,76,.16), inset 0 0 0 1px rgba(110,46,184,.16);
  padding: 3px;
}
.masthead-name {
  color: var(--w-deep);
  text-shadow: 2px 2px 0 rgba(255,216,77,.55);
}
.masthead-sub { color: var(--w-purple); letter-spacing: 4px; }
.masthead-right .issue {
  color: var(--w-deep);
  background: linear-gradient(90deg, rgba(255,216,77,.45), rgba(110,46,184,.10));
  border: 1px solid rgba(110,46,184,.22);
  border-radius: 999px;
  padding: 4px 10px;
}
.brand-hero {
  position: absolute;
  right: -18px;
  top: 152px;
  width: 188px;
  opacity: .13;
  transform: rotate(6deg);
  pointer-events: none;
  z-index: -1;
}
.lead-eyebrow { color: var(--w-purple); font-weight: 800; }
.lead-title { color: var(--w-night); }
.lead-deck {
  background: rgba(255,255,255,.46);
  border: 1px solid rgba(110,46,184,.23);
  border-left: 8px solid var(--w-gold);
  border-radius: 22px;
  padding: 24px 26px;
  box-shadow: 0 18px 42px rgba(43,16,76,.08);
}
.drop-cap { color: var(--w-purple); text-shadow: 2px 2px 0 rgba(255,216,77,.60); }
.section-divider { color: var(--w-purple); }
.section-divider::before, .section-divider::after { background: linear-gradient(90deg, transparent, var(--w-gold), var(--w-purple)); }
.story {
  position: relative;
  background: rgba(255,255,255,.28);
  border: 1px solid rgba(110,46,184,.12);
  border-radius: 28px;
  padding: 28px 28px 36px;
  box-shadow: 0 16px 36px rgba(43,16,76,.07);
}
.story::after {
  content: '✦';
  position:absolute; right:22px; top:14px;
  color: var(--w-gold); font-size: 26px;
  text-shadow: 0 0 16px rgba(255,216,77,.65);
}
.story-no { color: var(--w-purple); text-shadow: 3px 3px 0 rgba(255,216,77,.65); }
.story-badge, .hl-tag, details summary::after, .sop-step::before, .qa-a b { color: var(--w-purple); }
.story-quotes { border-left-color: var(--w-gold); background: rgba(255,216,77,.10); border-radius: 0 18px 18px 0; padding: 16px 20px; }
.quote-text::before, .quote-text::after { color: var(--w-purple); }
.hl-avatar { border-color: var(--w-deep); box-shadow: 5px 5px 0 var(--w-gold), 9px 9px 0 rgba(110,46,184,.28); }
.avatar-text { background: var(--w-deep); color: var(--w-cream); }
.brand-stickers {
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin: 42px 0 12px;
  padding: 20px;
  border-radius: 30px;
  background: linear-gradient(135deg, rgba(110,46,184,.10), rgba(255,216,77,.18));
  border: 1px solid rgba(110,46,184,.16);
}
.brand-sticker {
  display:flex; flex-direction:column; align-items:center; gap:6px;
  min-height: 126px;
  justify-content:center;
}
.brand-sticker img {
  width: 104px; height: 104px; object-fit:contain;
  filter: drop-shadow(0 8px 12px rgba(43,16,76,.16));
}
.brand-sticker span {
  font-size: 11px; line-height:1.2; color: var(--w-deep); text-align:center;
  font-family: 'SerifCJK', 'Songti SC', serif;
  opacity:.72;
}
.colophon {
  position: relative;
  border-top-color: var(--w-deep);
  padding-bottom: 58px;
}
.brand-watermark {
  margin-top: 34px;
  font-family: Georgia, 'SerifCJK', serif;
  font-size: 18px;
  font-style: italic;
  letter-spacing: .5px;
  color: rgba(110,46,184,.22);
  text-shadow: 0 1px 0 rgba(255,255,255,.7);
}
.brand-watermark-ghost {
  position:absolute;
  left: 50%; bottom: -6px;
  transform: translateX(-50%);
  white-space: nowrap;
  font-family: Georgia, 'SerifCJK', serif;
  font-size: 30px;
  font-style: italic;
  font-weight: 700;
  color: rgba(43,16,76,.045);
  pointer-events:none;
}
@media (max-width: 600px) {
  .brand-hero { width: 130px; right: 0; top: 128px; }
  .brand-stickers { grid-template-columns: repeat(2, 1fr); }
  .brand-mark { width: 48px; height: 48px; }
}



/* ====== Feedback Patch 2026-06-01: softer, cuter, exact brand case ====== */
:root {
  --w-hand: 'HanziPen SC', 'Hannotate SC', 'Klee', 'Klee One', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'SerifCJK', cursive;
}
html {
  background:
    radial-gradient(circle at 14% 8%, rgba(255,216,77,.22), transparent 22%),
    radial-gradient(circle at 88% 10%, rgba(255,143,163,.16), transparent 24%),
    radial-gradient(circle at 58% 94%, rgba(110,46,184,.11), transparent 28%),
    linear-gradient(180deg, #FFF8E9 0%, #FAEEFF 54%, #FFF8E9 100%) !important;
}
body::before {
  /* 去掉斜杠条纹，改成柔和星点/圆点纸感 */
  background-image:
    radial-gradient(circle at 18% 18%, rgba(255,216,77,.32) 0 2px, transparent 3px),
    radial-gradient(circle at 74% 28%, rgba(110,46,184,.14) 0 2px, transparent 3px),
    radial-gradient(circle at 42% 76%, rgba(57,183,255,.12) 0 2px, transparent 3px),
    radial-gradient(circle at 86% 82%, rgba(255,143,163,.12) 0 2px, transparent 3px);

}

}
.masthead-name {

  letter-spacing: 1px !important;

}
.masthead-sub {
  font-family: var(--w-hand) !important;
  text-transform: none !important;
  letter-spacing: .06em !important;
  word-spacing: .08em !important;
  color: #7B43C8 !important;
  font-size: 13px !important;
  font-weight: 700 !important;
  white-space: nowrap;
}
.masthead-sub::before {
  content: '✦';
  color: var(--w-gold);
  margin-right: 7px;
  text-shadow: 0 0 8px rgba(255,216,77,.75);
}
.masthead-sub::after {
  content: '✦';
  color: var(--w-gold);
  margin-left: 7px;
  text-shadow: 0 0 8px rgba(255,216,77,.75);
}
.masthead-right .issue {
  font-family: var(--w-hand) !important;
  font-style: normal !important;
  letter-spacing: .08em !important;
  transform: rotate(-.8deg);
}
.masthead-right .date {
  font-family: var(--w-hand) !important;

  font-weight: 700;
}
.lead-eyebrow, .section-divider, .hl-tag, .cast-label, .colophon-meta, .colophon-num .l {
  text-transform: none !important;

}
.lead-title, .story-theme, details summary, .hl-name {
  font-family: var(--w-hand) !important;
}
.story {
  border-radius: 32px 26px 34px 24px;
}
.story::after {
  content: '✧';
  font-family: var(--w-hand);
}
.brand-watermark, .brand-watermark-ghost {
  font-family: var(--w-hand) !important;
}

</style>
</head>
<body>
<div class="container">
<img class="brand-hero" src="{{BRAND_HERO}}" alt="WaytoAGI-EDU mascot decoration">

<div class="masthead">
  <div class="masthead-left">
    <div class="brand-title-row"><img class="brand-mark" src="{{BRAND_MASCOT}}" alt="WaytoAGI-EDU mascot"><div><div class="masthead-name">群日报</div>
    <div class="masthead-sub">WaytoAGI-EDU · Magic Daily</div></div></div>
